# Builds, tests and lints EVERY app in this repo, and uploads the signed Play bundles (.aab).
# Repo secrets (Settings > Secrets and variables > Actions), shared by all apps:
#   MMN_UPLOAD_KEYSTORE_BASE64, MMN_UPLOAD_KEYSTORE_PASSWORD, MMN_UPLOAD_KEY_ALIAS, MMN_UPLOAD_KEY_PASSWORD
# Without them, bundles are debug-signed and Play Console will refuse them.
name: Android apps
on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Upload keystore
        env: { KS: "${{ secrets.MMN_UPLOAD_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "MMN_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key secret: bundles will be debug-signed (not accepted by Play)."
          fi
      - run: ./gradlew --no-daemon test lint bundleRelease assembleRelease
        env:
          MMN_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MMN_UPLOAD_KEYSTORE_PASSWORD }}
          MMN_UPLOAD_KEY_ALIAS: ${{ secrets.MMN_UPLOAD_KEY_ALIAS }}
          MMN_UPLOAD_KEY_PASSWORD: ${{ secrets.MMN_UPLOAD_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundles
          path: |
            apps/*/build/outputs/bundle/release/*.aab
            apps/*/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            apps/*/build/reports/
            core/build/reports/
